<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Procurement Chain</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root { --ink:#0d1b3e; --muted:#3b4252; --line:#9aa3b2; --bg:#ffffff; }
  body { margin:0; background:var(--bg); font-family:"Plus Jakarta Sans", Arial, sans-serif; }
  .wrap { max-width:2180px; margin:0 auto; padding:16px; box-sizing:border-box; }
  svg { width:100%; height:auto; display:block; font-family:"Plus Jakarta Sans", Arial, sans-serif; }
</style>
</head>
<body>
<div class="wrap">
<svg id="chart" viewBox="0 0 2180 725" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Procurement chain for custom steel windows and doors, from buyout on Jul 16, 2026 to required on site Nov 30, 2027">
  <defs>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0d1b3e" flood-opacity="0.18"/>
    </filter>
    <filter id="cardShadow" x="-5%" y="-20%" width="110%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0d1b3e" flood-opacity="0.10"/>
    </filter>
    <marker id="arrowR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12" orient="auto">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="#9aa3b2" stroke-width="1.4"/>
    </marker>
    <marker id="arrowL" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="12" markerHeight="12" orient="auto">
      <path d="M9 1 L1 5 L9 9" fill="none" stroke="#9aa3b2" stroke-width="1.4"/>
    </marker>
  </defs>

  <!-- ===== LOGO SLOT =====
       Replace this whole <g> with your real logo, for example:
       <image href="jitpro-logo.svg" x="60" y="30" width="190" height="80" preserveAspectRatio="xMinYMid meet"/>
  -->
  <g id="logo-slot">
    <rect x="60" y="30" width="190" height="80" rx="10" fill="#f4f6fa" stroke="#9aa3b2" stroke-dasharray="6 5"/>
    <text x="155" y="76" text-anchor="middle" font-size="17" font-weight="700" fill="#6b7385">JiTpro logo</text>
  </g>

  <line x1="278" y1="22" x2="278" y2="106" stroke="#c9ced8" stroke-width="2"/>
  <text x="320" y="60" font-size="50" font-weight="800" fill="#0d1b3e" letter-spacing="-0.5">Procurement Chain — Custom Steel Windows and Doors</text>
  <text x="320" y="96" font-size="26" font-weight="500" fill="#3b4252">From buyout through submittals, reviews, fabrication, and delivery to the Required On Site Date.</text>

  <g id="callouts"></g>
  <g id="chain"></g>
  <g id="milestones"></g>
  <g id="durations"></g>

  <!-- Timeline summary row -->
  <text x="52" y="495" font-size="26" fill="#0d1b3e"><tspan font-weight="800">Start:</tspan><tspan font-weight="500"> Jul 16, 2026</tspan></text>
  <line x1="298" y1="488" x2="850" y2="488" stroke="#9aa3b2" stroke-width="2" marker-start="url(#arrowL)"/>
  <text x="1086" y="495" text-anchor="middle" font-size="27" fill="#3b4252"><tspan font-weight="500">Total Duration: </tspan><tspan font-weight="800" fill="#0d1b3e">332 working days</tspan></text>
  <line x1="1320" y1="488" x2="1700" y2="488" stroke="#9aa3b2" stroke-width="2" marker-end="url(#arrowR)"/>
  <text x="2132" y="495" text-anchor="end" font-size="26" fill="#0d1b3e"><tspan font-weight="800">Required On Site:</tspan><tspan font-weight="500"> Nov 30, 2027</tspan></text>

  <!-- Legend card -->
  <rect x="20" y="543" width="2132" height="152" rx="22" fill="#ffffff" filter="url(#cardShadow)"/>
  <text x="48" y="619" font-size="25" font-weight="800" fill="#0d1b3e">Legend</text>
  <line x1="160" y1="575" x2="160" y2="657" stroke="#d6dae2" stroke-width="2"/>
  <line x1="1515" y1="575" x2="1515" y2="657" stroke="#d6dae2" stroke-width="2"/>
  <line x1="1722" y1="575" x2="1722" y2="657" stroke="#d6dae2" stroke-width="2"/>
  <g id="legend"></g>
</svg>
</div>

<script>
/* ---------- Data (edit here) ---------- */
const BAR_Y = 308, BAR_H = 70, CY = BAR_Y + BAR_H / 2;
const D = 22;      // depth of chevron point
const GAP = 4;     // gap between joined chevrons

// "join: true" means the segment butts up against the previous one.
const segments = [
  { x0: 32,   x1: 195,  color: "#2453b9", icon: "hand",    lines: ["Buyout"],                     dur: ["20 days"],  shape: "start" },
  {           x1: 380,  color: "#14899a", icon: "org",     lines: ["Submittal", "Coordination"],  dur: ["25 days"],  join: true },
  {           x1: 560,  color: "#0f5ff0", icon: "doc",     lines: ["Submittal", "Preparation"],   dur: ["30 days"],  join: true },
  { x0: 595,  x1: 737,  color: "#7b2fd8", icon: "search",  lines: ["Review 1"],                   dur: ["15 days"] },
  {           x1: 885,  color: "#6b2bcb", icon: "cycle",   lines: ["Revision 1", "(Resubmittal)"], dur: ["12 days"], join: true },
  { x0: 922,  x1: 1068, color: "#7b2fd8", icon: "search",  lines: ["Review 2"],                   dur: ["15 days"] },
  {           x1: 1222, color: "#6b2bcb", icon: "cycle",   lines: ["Revision 2", "(Resubmittal)"], dur: ["12 days"], join: true },
  { x0: 1268, x1: 1418, color: "#7b2fd8", icon: "search",  lines: ["Review 3"],                   dur: ["15 days"] },
  {           x1: 1585, color: "#1366e6", icon: "check",   lines: ["Final", "Approval &", "Release"], dur: ["0 days", "(milestone)"], join: true },
  {           x1: 1760, color: "#f28c12", icon: "factory", lines: ["Fabrication"],                dur: ["180 days"], join: true },
  {           x1: 1930, color: "#b53f1b", icon: "truck",   lines: ["Shipping", "& Delivery"],     dur: ["8 days"],   join: true },
  { x0: 1955, x1: 2142, color: "#1d8a3c", icon: "cal",     lines: ["Required", "On Site"],        dur: [],           shape: "end" },
];

const milestones = [
  { x: 580,  label: ["Initial", "Submittal", "(milestone)"], stem: false, labelY: 400 },
  { x: 907,  label: ["Submittal 2", "(milestone)"],          stem: true,  labelY: 404 },
  { x: 1248, label: ["Submittal 3", "(milestone)"],          stem: true,  labelY: 404 },
  { x: 1940, label: [],                                      stem: false, dashed: true },
];

const callouts = [
  { x: 294,  y: 142, w: 278, h: 95, kind: "commitment", title: "Commitment", body: ["Subcontractor to provide", "submittal package by Day 75"], anchorX: 460 },
  { x: 991,  y: 141, w: 292, h: 96, kind: "issue",      title: "Issue",      body: ["Review comments require", "additional coordination"],      anchorX: 1143 },
  { x: 1390, y: 141, w: 267, h: 96, kind: "commitment", title: "Commitment", body: ["Final approval and release", "by Day 154"],                anchorX: 1533 },
];

const legend = [
  { x: 188,  color: "#2453b9", title: ["Buyout"],                 desc: ["Contracting", "and commitments"] },
  { x: 373,  color: "#14899a", title: ["Submittal", "Coordination"], desc: ["Align scope,", "schedule, and", "responsibilities"] },
  { x: 568,  color: "#0f5ff0", title: ["Submittal", "Preparation"],  desc: ["Build and compile", "submittal package"] },
  { x: 763,  color: "#7b2fd8", title: ["Review"],                 desc: ["Review submittal", "and provide", "comments"] },
  { x: 949,  color: "#6b2bcb", title: ["Revision"],               desc: ["Revise and", "resubmit based", "on comments"] },
  { x: 1122, color: "#f28c12", title: ["Fabrication"],            desc: ["Manufacture", "custom steel", "windows and doors"] },
  { x: 1333, color: "#b53f1b", title: ["Shipping &", "Delivery"],    desc: ["Transport and", "deliver to site"] },
  { x: 1545, marker: "milestone",  title: ["Milestone"],  desc: ["Key deliverable", "or decision point", "(0 days)"] },
  { x: 1752, marker: "commitment", title: ["Commitment"], desc: ["Required action", "by a specific party"] },
  { x: 1977, marker: "issue",      title: ["Issue"],      desc: ["Risk, delay, or", "open item"] },
];

const COLORS = { milestone: "#0d1730", commitment: "#c8104f", commitFill: "#fdeef2", issue: "#f39a12", issueFill: "#fff7e3" };

/* ---------- Icons (32x32, white line art) ---------- */
const ICONS = {
  hand:    '<path d="M1 13 L7 8 L13 11 L17 9 L23 8 L31 13"/><path d="M1 13 L5 19 L12 26 C14 28 16 27 15 25 C17 27 19 26 18 24 C20 25 22 24 21 22 C23 22 24 20 22 18 L27 19 L31 13"/><path d="M13 11 L9 15 C8 17 10 18 12 17 L16 14 L22 18"/>',
  org:     '<rect x="11" y="2" width="10" height="8" rx="1.5"/><path d="M16 10 V15 M5 15 H27 M5 15 V20 M16 15 V20 M27 15 V20"/><rect x="1" y="20" width="8" height="8" rx="1.5"/><rect x="12" y="20" width="8" height="8" rx="1.5"/><rect x="23" y="20" width="8" height="8" rx="1.5"/>',
  doc:     '<path d="M6 2 H20 L27 9 V30 H6 Z"/><path d="M20 2 V9 H27"/><path d="M11 15 H22 M11 20 H22 M11 25 H18"/>',
  search:  '<circle cx="13" cy="13" r="10"/><path d="M20.5 20.5 L30 30"/>',
  cycle:   '<path d="M27 12 A12 12 0 0 0 5.5 9.5"/><path d="M5 3 V10 H12"/><path d="M5 20 A12 12 0 0 0 26.5 22.5"/><path d="M27 29 V22 H20"/>',
  check:   '<circle cx="16" cy="16" r="14"/><path d="M9.5 16.5 L14 21 L23 11"/>',
  factory: '<path d="M2 30 V17 L10 12 V17 L18 12 V17 L24 13 V30 Z"/><path d="M24 30 V3 H29 V30"/><path d="M1 30 H31"/><path d="M6 24 H9 M13 24 H16 M19 24 H21"/>',
  truck:   '<path d="M2 7 H20 V23 H2 Z"/><path d="M20 12 H26 L31 18 V23 H20"/><circle cx="8" cy="25" r="3" fill="currentColor"/><circle cx="25" cy="25" r="3" fill="currentColor"/>',
  cal:     '<rect x="2" y="5" width="28" height="25" rx="3"/><path d="M2 12 H30 M9 2 V8 M23 2 V8"/><path d="M7 17 h3 M14.5 17 h3 M22 17 h3 M7 22 h3 M14.5 22 h3 M22 22 h3 M7 26.5 h3 M14.5 26.5 h3"/>',
};

/* ---------- Helpers ---------- */
const NS = "http://www.w3.org/2000/svg";
const $ = id => document.getElementById(id);
function el(tag, attrs = {}, html) {
  const n = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(attrs)) n.setAttribute(k, v);
  if (html !== undefined) n.innerHTML = html;
  return n;
}
function diamond(cx, cy, r, fill) {
  return el("path", { d: `M${cx} ${cy - r} L${cx + r} ${cy} L${cx} ${cy + r} L${cx - r} ${cy} Z`, fill, stroke: "#fff", "stroke-width": 2 });
}
function triangle(cx, cy, r, fill) {
  return el("path", { d: `M${cx} ${cy - r} L${cx + r * 1.1} ${cy + r * 0.8} L${cx - r * 1.1} ${cy + r * 0.8} Z`, fill, stroke: "#fff", "stroke-width": 2, "stroke-linejoin": "round" });
}

/* ---------- Chevron chain ---------- */
let prevX1 = null;
segments.forEach(s => {
  if (s.join) s.x0 = prevX1 - D + GAP;
  prevX1 = s.x1;
  const y0 = BAR_Y, y1 = BAR_Y + BAR_H, r = BAR_H / 2;
  let d;
  if (s.shape === "start") {
    d = `M${s.x0 + r} ${y0} L${s.x1 - D} ${y0} L${s.x1} ${CY} L${s.x1 - D} ${y1} L${s.x0 + r} ${y1} A${r} ${r} 0 0 1 ${s.x0 + r} ${y0} Z`;
  } else if (s.shape === "end") {
    d = `M${s.x0} ${y0} L${s.x1 - r} ${y0} A${r} ${r} 0 0 1 ${s.x1 - r} ${y1} L${s.x0} ${y1} L${s.x0 + D} ${CY} Z`;
  } else {
    d = `M${s.x0} ${y0} L${s.x1 - D} ${y0} L${s.x1} ${CY} L${s.x1 - D} ${y1} L${s.x0} ${y1} L${s.x0 + D} ${CY} Z`;
  }
  const g = el("g", { class: "seg" });
  g.appendChild(el("path", { d, fill: s.color, filter: "url(#shadow)" }));

  // icon + label layout
  const contentStart = s.shape === "start" ? s.x0 + 20 : s.x0 + D - 2;
  const contentEnd = s.shape === "end" ? s.x1 - 24 : s.x1 - 6;
  const iconX = contentStart + 4;
  g.appendChild(el("g", { transform: `translate(${iconX} ${CY - 14}) scale(0.875)`, fill: "none", stroke: "#fff", "stroke-width": 2.4, "stroke-linecap": "round", "stroke-linejoin": "round", color: "#fff" }, ICONS[s.icon]));
  const textCx = (iconX + 28 + 8 + contentEnd) / 2;
  const lh = s.lines.length === 3 ? 20 : 21;
  const startY = CY - ((s.lines.length - 1) * lh) / 2 + 6;
  const t = el("text", { "text-anchor": "middle", fill: "#fff", "font-weight": 800 });
  s.lines.forEach((line, i) => {
    const small = line.startsWith("(");
    const ts = el("tspan", { x: textCx, y: startY + i * lh, "font-size": small ? 13 : 18, "letter-spacing": -0.3 });
    ts.textContent = line;
    t.appendChild(ts);
  });
  g.appendChild(t);
  $("chain").appendChild(g);

  // duration under the segment
  if (s.dur.length) {
    const cx = (s.x0 + s.x1) / 2;
    const dt = el("text", { "text-anchor": "middle", fill: "#3b4252", "font-size": 21, "font-weight": 500 });
    s.dur.forEach((line, i) => {
      const ts = el("tspan", { x: cx, y: (s.dur.length > 1 ? 411 : 415) + i * 22 });
      ts.textContent = line;
      dt.appendChild(ts);
    });
    $("durations").appendChild(dt);
  }
});

/* ---------- Milestones ---------- */
milestones.forEach(m => {
  const g = $("milestones");
  if (m.dashed) g.appendChild(el("line", { x1: m.x, y1: 240, x2: m.x, y2: 445, stroke: "#9aa3b2", "stroke-width": 2, "stroke-dasharray": "6 6" }));
  if (m.stem) g.appendChild(el("line", { x1: m.x, y1: CY + 14, x2: m.x, y2: CY + 34, stroke: "#0d1730", "stroke-width": 2 }));
  g.appendChild(diamond(m.x, CY, 17, COLORS.milestone));
  if (m.label.length) {
    const t = el("text", { "text-anchor": "middle", "font-size": 16, fill: "#0d1b3e" });
    m.label.forEach((line, i) => {
      const ts = el("tspan", { x: m.x, y: m.labelY + i * 19, "font-weight": line.startsWith("(") ? 500 : 800 });
      ts.textContent = line;
      t.appendChild(ts);
    });
    g.appendChild(t);
  }
});

/* ---------- Callouts ---------- */
callouts.forEach(c => {
  const isIssue = c.kind === "issue";
  const stroke = isIssue ? COLORS.issue : COLORS.commitment;
  const fill = isIssue ? COLORS.issueFill : COLORS.commitFill;
  const g = el("g");
  g.appendChild(el("line", { x1: c.anchorX, y1: c.y + c.h, x2: c.anchorX, y2: BAR_Y - 4, stroke, "stroke-width": 2 }));
  g.appendChild(el("rect", { x: c.x, y: c.y, width: c.w, height: c.h, rx: 10, fill, stroke, "stroke-width": 2 }));
  const t = el("text", { "text-anchor": "middle", fill: "#0d1b3e" });
  const cx = c.x + c.w / 2;
  const tt = el("tspan", { x: cx, y: c.y + 32, "font-size": 24, "font-weight": 800 }); tt.textContent = c.title; t.appendChild(tt);
  c.body.forEach((line, i) => {
    const ts = el("tspan", { x: cx, y: c.y + 58 + i * 24, "font-size": 19.5, "font-weight": 500, fill: "#3b4252" });
    ts.textContent = line; t.appendChild(ts);
  });
  g.appendChild(t);
  g.appendChild(isIssue ? triangle(c.anchorX, BAR_Y - 6, 15, COLORS.issue) : diamond(c.anchorX, BAR_Y - 4, 14, COLORS.commitment));
  $("callouts").appendChild(g);
});

/* ---------- Legend ---------- */
legend.forEach(item => {
  const g = $("legend");
  if (item.color) g.appendChild(el("rect", { x: item.x, y: 578, width: 32, height: 20, rx: 5, fill: item.color }));
  else if (item.marker === "milestone") g.appendChild(diamond(item.x + 14, 592, 15, COLORS.milestone));
  else if (item.marker === "commitment") g.appendChild(diamond(item.x + 14, 590, 15, COLORS.commitment));
  else if (item.marker === "issue") g.appendChild(triangle(item.x + 14, 592, 13, COLORS.issue));
  const tx = item.x + (item.color ? 42 : 36);
  const t = el("text", { fill: "#0d1b3e" });
  let y = 593;
  item.title.forEach(line => { const ts = el("tspan", { x: tx, y, "font-size": 18, "font-weight": 800 }); ts.textContent = line; t.appendChild(ts); y += 19; });
  y += 2;
  item.desc.forEach(line => { const ts = el("tspan", { x: tx, y, "font-size": 16, "font-weight": 500, fill: "#454c5c" }); ts.textContent = line; t.appendChild(ts); y += 20; });
  g.appendChild(t);
});
</script>
</body>
</html>
